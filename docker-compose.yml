services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?Set ODOO_ADMIN_PASSWORD in .env}
      ODOO_HTTP_PORT: ${ODOO_HTTP_PORT:-8077}
    ports:
      - "${ODOO_HTTP_PORT:-8077}:${ODOO_HTTP_PORT:-8077}"
    volumes:
      - ./odoo:/mnt/odoo:ro
      - ./custom_addons:/mnt/custom_addons:ro
      - ./config:/mnt/config:ro
      - odoo-data:/var/lib/odoo
    command: ["/usr/local/bin/project-odoo-entrypoint"]

volumes:
  postgres-data:
  odoo-data:
